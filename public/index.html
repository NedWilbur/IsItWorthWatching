<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f5">
    <meta name="description" content="A quick, low-expectation answer to the movie question: is it worth watching?">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Is It Worth Watching?">
    <meta property="og:description" content="Pick a movie. Get one honest answer, with appropriately low expectations.">
    <title>Is It Worth Watching?</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="/">Is It Worth Watching?</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="/about">About</a>
                <a class="nav-support" href="/beer">Give back</a>
            </nav>
        </header>

        <main class="home-main">
            <section class="search-card" aria-labelledby="page-title">
                <h1 id="page-title">Is it worth watching?</h1>
                <p class="intro">Search a title, pick a match, and get a straight answer.</p>

                <form id="search-form" class="search-form" role="search" novalidate>
                    <label class="visually-hidden" for="query">Search for a movie</label>
                    <input
                        id="query"
                        name="query"
                        type="search"
                        placeholder="Search movie titles"
                        maxlength="100"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        enterkeyhint="search"
                        role="combobox"
                        aria-autocomplete="list"
                        aria-controls="options"
                        aria-expanded="false"
                        aria-describedby="search-status"
                    >
                    <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" hidden>
                        Clear
                    </button>
                    <span id="spinner" class="spinner" aria-hidden="true" hidden>…</span>
                </form>

                <ul id="options" class="movie-options" role="listbox" aria-label="Movie search results" hidden></ul>
                <p id="search-status" class="search-status" role="status" aria-live="polite">Search by movie title to get started.</p>

                <section id="result" class="result-card" aria-live="polite" aria-atomic="true" hidden></section>
            </section>
        </main>

        <footer class="site-footer">
            <span>Based on TMDB audience ratings.</span>
            <a href="/about">How it works</a>
        </footer>
    </div>
</body>
</html>
